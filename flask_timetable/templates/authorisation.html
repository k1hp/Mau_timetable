
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фоновое изображение</title>
    <style>
        body {
            background-image: url('{{ url_for("static", filename="images/back.jpg")}}'); /* Укажите путь к вашему изображению */
            background-size: cover; 
            background-position: center; /* Центрирование изображения */
            background-repeat: no-repeat; /* Изображение не будет повторяться */
            height: 100vh;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='beauty.css') }}">
    <link rel="icon" href="https://img.icons8.com/pastel-glyph/64/laptop-metrics.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='btns.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='helpers.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='flashes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='form.css') }}">
</head>
<body>
    

    <div class="container-fluid vh-100 alignment">
        <div class="row">

            <div class="col-12 form-body">
                <div class="alignment">
                    <h1>Authorisation</h1>

                </div>
    
    
                        <div class="alignment">
                            <form action="/authorisation" method="POST">
                                {% if username is none %}
                                <input type="text" name="user" class="form-control transparent-input my-3" placeholder="Username">
                                {% else %}
                                <input type="text" name="user" class="form-control transparent-input my-3" placeholder="Username" value="{{ username }}">
                                {% endif %}
                                 
                                {% set messages = get_flashed_messages(with_categories=True) %}
                                {% if messages %}
                                    {% for category, value in messages %}
                                            <input type="password" id="inputPassword6" name="passwd" class="form-control {{ category }} transparent-input my-3" placeholder="Password" aria-describedby="passwordHelpInline">
                                        
                                    {% endfor %}
                                {% else %}
                                    <input type="password" id="inputPassword6" name="passwd" class="form-control transparent-input my-3" placeholder="Password" aria-describedby="passwordHelpInline">
                                {% endif %}

                                    <div class="button_alignment">
                                        <button type="submit" class="other_button">
                                            <div class="form-logo"></div>
                                        </button>
                    
                                    </div>
                            </form>
                        </div>
                        
                        <div class="row pt-2">
                            <div class="col-6 alignment">
                                
                                <a href="/" class="other_button">
                                    HOME
                                    </a>
                            </div>
                            <div class="col-6 button_alignment">
                                    <a href="/authorisation/sign_up" class="other_button">
                                    SIGN UP
                                    </a>
                            </div>
                
                        </div>
                    
                        
                </div>
                    </div>
    
    
    </div>
</body>

</html>
